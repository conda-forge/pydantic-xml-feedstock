schema_version: 1

context:
  version: "2.22.0"

package:
  name: pydantic-xml
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/pydantic-xml/pydantic-xml/pydantic_xml-${{ version }}.tar.gz
  sha256: 3f3382a0aaa5117e117541cdb4e5b6ceeaa7d9ffeea7b30e742a8b221589bca8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.14.0
    - pydantic-core >=2.15.0
  run_constraints:
    - lxml >=4.9.0

tests:
  - python:
      imports:
        - pydantic_xml
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: pydantic xml extension
  license: Unlicense
  license_file: LICENSE
  homepage: https://github.com/dapper91/pydantic-xml

extra:
  recipe-maintainers:
    - synapticarbors
